services:
  haven-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: haven-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - haven_sql_data:/var/opt/mssql

volumes:
  haven_sql_data:
    name: haven_sql_data
