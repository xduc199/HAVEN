name: HAVEN - CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: haven-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore HAVEN.slnx

      - name: Build solution
        run: dotnet build HAVEN.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test HAVEN.slnx --configuration Release --no-build --logger "console;verbosity=normal"